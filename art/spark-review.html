<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photo-model geometry review</title><style>body{margin:0;background:#cfd3d8}canvas{display:block}#caption{position:fixed;left:20px;top:16px;font:16px Arial;color:#26303b}</style></head><body><div id="caption">Actual game mesh · photo reconstruction</div><script type="module">
import*as THREE from'three';import{makeSpark}from'/src/vehicles/spark-model.js';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.append(renderer.domElement);const scene=new THREE.Scene();scene.background=new THREE.Color('#cbd0d8');const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,30);const model=makeSpark('#1260f4','classic',true);model.userData.rider.visible=false;scene.add(model);scene.add(new THREE.HemisphereLight('#f4f8ff','#48505a',2.1));for(const[x,y,z,power]of[[-3,5,3,3],[3,3,-3,2]]){const sun=new THREE.DirectionalLight('#fff4df',power);sun.position.set(x,y,z);scene.add(sun);}const ground=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({color:'#adb3bc',roughness:.85}));ground.rotation.x=-Math.PI/2;ground.position.y=-.31;scene.add(ground);const poses={front:[2.7,2.7,4.3],back:[2.2,2.7,-4.5],side:[4.7,1.7,.1],top:[.01,5,.01]};window.review={view(name){camera.position.fromArray(poses[name]);camera.lookAt(0,.25,0);renderer.render(scene,camera);},model};window.review.view('front');
</script></body></html>
