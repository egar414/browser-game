<!doctype html><html><head><meta charset="utf-8"><title>Sunco Hoons · fleet model review</title><link rel="icon" href="data:,"><style>body{margin:0;background:#202a31;color:#eef2f4;font:14px system-ui}header{height:54px;padding:0 20px;display:flex;align-items:center;gap:18px}select,button{padding:6px;background:#34454f;color:white;border:1px solid #637682}canvas{display:block}#stats{margin-left:auto}</style></head><body><header><strong>Actual game fleet</strong><select id="craft"></select><button data-view="front">Bow</button><button data-view="rear">Stern</button><button data-view="side">Side</button><button data-view="angle">Orbit</button><button data-view="top">Interior</button><span id="stats"></span></header><script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {makeVehicle} from '../src/vehicles/models.js';
import {makeSurfYacht} from '../src/surf/yacht.js';
import {VEHICLES} from '../src/config.js';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight-54);renderer.setPixelRatio(1);renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#202a31');const generator=new THREE.PMREMGenerator(renderer),room=new RoomEnvironment();scene.environment=generator.fromScene(room,.04).texture;room.dispose();generator.dispose();scene.add(new THREE.HemisphereLight('#e3edff','#303a40',.8));for(const[x,y,z,p]of[[-4,7,5,3],[5,4,-5,1.6]]){const light=new THREE.DirectionalLight('#fff4df',p);light.position.set(x,y,z);scene.add(light);}
const camera=new THREE.PerspectiveCamera(38,innerWidth/(innerHeight-54),.01,300),controls=new OrbitControls(camera,renderer.domElement);let model,type,length,target,span;
function render(){renderer.render(scene,camera);}
function view(name){const directions={angle:[.9,.60,-1.05],front:[0,.12,1.7],rear:[0,.12,-1.7],side:[1.7,.12,0],top:[0,1.9,.001]};camera.position.copy(target).add(new THREE.Vector3(...directions[name]).multiplyScalar(span));camera.lookAt(target);controls.target.copy(target);controls.update();render();}
function select(value){if(model){scene.remove(model);model.traverse(o=>o.geometry?.dispose());}type=value;const c=VEHICLES[type];model=type==='yacht'?makeSurfYacht():makeVehicle(type,c.colours[0],'classic',{creator:true});for(const part of[model.userData.rider,model.userData.passenger,model.userData.captain])if(part)part.visible=false;scene.add(model);model.updateMatrixWorld(true);const bounds=new THREE.Box3().setFromObject(model),size=bounds.getSize(new THREE.Vector3());length=c?.length||20.5;span=Math.max(size.x,size.z,size.y*.95)*.80;target=bounds.getCenter(new THREE.Vector3());target.y=Math.min(target.y,size.y*.35);document.getElementById('craft').value=type;view('angle');document.getElementById('stats').textContent=`${renderer.info.render.triangles.toLocaleString()} triangles · ${renderer.info.render.calls} draws`;return{type,triangles:renderer.info.render.triangles,draws:renderer.info.render.calls,size:size.toArray()};}
for(const type of['angler','tinny','dinghy','skua','cat','ski','seago','hyper','racer','cruiser','dive','rib','yacht']){const option=document.createElement('option');option.value=type;option.textContent=VEHICLES[type]?.name||'Surf support yacht';document.getElementById('craft').append(option);}
document.getElementById('craft').onchange=e=>select(e.target.value);document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));controls.addEventListener('change',render);window.fleetReview={select,view,renderer,get model(){return model;}};select('tinny');
</script></body></html>
